<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- 品牌红渐变 -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0009"/>
      <stop offset="100%" stop-color="#D90008"/>
    </linearGradient>
    <!-- 海军蓝渐变 -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#1A365D"/>
    </linearGradient>
    <!-- 入口层浅蓝渐变 -->
    <linearGradient id="entryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <!-- 卡片渐变 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <!-- 阴影 -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0A2540" flood-opacity="0.08"/>
    </filter>
    <filter id="shadowLight">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0A2540" flood-opacity="0.05"/>
    </filter>
    <filter id="shadowEntry">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0A2540" flood-opacity="0.12"/>
    </filter>

    <!-- 箭头标记 -->
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF0009"/>
    </marker>
    <marker id="arrowNavy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0A2540"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- ===== 白色背景 ===== -->
  <rect width="900" height="520" fill="#FFFFFF" rx="12"/>
  <rect x="1" y="1" width="898" height="518" rx="11" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ===== 顶部装饰线 ===== -->
  <rect x="300" y="0" width="300" height="3" rx="1.5" fill="#FF0009"/>

  <!-- ============================================================ -->
  <!-- 标题 -->
  <!-- ============================================================ -->
  <text x="450" y="35" fill="#0A2540" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="-0.3">TUNTAS Architecture — AmBank Capability Assurance OS</text>
  <text x="450" y="52" fill="#64748B" font-size="10" text-anchor="middle" letter-spacing="0.3">Traceable Upskilling · Normative Training · Regulatory Readiness</text>

  <!-- ============================================================ -->
  <!-- 第1层：入口 (Entry Points) -->
  <!-- ============================================================ -->
  <rect x="100" y="75" width="700" height="75" rx="10" fill="url(#entryGrad)" stroke="#E2E8F0" stroke-width="1" filter="url(#shadowEntry)"/>
  <text x="120" y="98" fill="#64748B" font-size="10" font-weight="600" letter-spacing="2" text-transform="uppercase">Entry Points</text>

  <!-- WorkBuddy MCP -->
  <rect x="130" y="110" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#818CF8" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="250" y="130" fill="#6366F1" font-size="12" font-weight="600" text-anchor="middle">🖥️ WorkBuddy (MCP)</text>

  <!-- Web Cockpit -->
  <rect x="530" y="110" width="240" height="30" rx="8" fill="#FFFFFF" stroke="#22D3EE" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="650" y="130" fill="#06B6D4" font-size="12" font-weight="600" text-anchor="middle">🌐 Web cockpit</text>

  <!-- 汇聚线 -->
  <path d="M250 140 L250 165 L450 165 L450 180" stroke="#94A3B8" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M650 140 L650 165 L450 165 L450 180" stroke="#94A3B8" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- 汇聚点 -->
  <circle cx="450" cy="180" r="4" fill="#FF0009"/>
  <circle cx="450" cy="180" r="8" fill="#FF0009" opacity="0.15"/>

  <!-- ============================================================ -->
  <!-- 第2层：核心 API -->
  <!-- ============================================================ -->
  <rect x="175" y="190" width="550" height="50" rx="12" fill="#FFFFFF" stroke="#FF0009" stroke-width="2" filter="url(#shadow)"/>
  <rect x="175" y="190" width="550" height="50" rx="12" fill="#FFE8E9" opacity="0.4"/>
  <text x="450" y="212" fill="#FF0009" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="-0.5">⚡ FastAPI TUNTAS API</text>
  <text x="450" y="232" fill="#64748B" font-size="10" text-anchor="middle">LangGraph Durable Workflow · State Machine · Human-in-the-Loop · MCP Gateway</text>

  <!-- 向下分支箭头 -->
  <line x1="250" y1="240" x2="250" y2="280" stroke="#FF0009" stroke-width="1.5" marker-end="url(#arrowRed)" opacity="0.7"/>
  <line x1="380" y1="240" x2="380" y2="280" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowGray)" opacity="0.4"/>
  <line x1="520" y1="240" x2="520" y2="280" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowGray)" opacity="0.4"/>
  <line x1="650" y1="240" x2="650" y2="280" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowGray)" opacity="0.4"/>

  <!-- ============================================================ -->
  <!-- 第3层：后端服务 (Backend Services) -->
  <!-- ============================================================ -->
  <rect x="80" y="285" width="740" height="200" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="100" y="308" fill="#64748B" font-size="10" font-weight="600" letter-spacing="2" text-transform="uppercase">Backend Services</text>

  <!-- 第一行：Supabase + Gemini + Tavily -->
  <rect x="100" y="320" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadowLight)"/>
  <rect x="100" y="320" width="220" height="90" rx="8" fill="#EFF6FF" opacity="0.3"/>
  <text x="210" y="345" fill="#2563EB" font-size="13" font-weight="700" text-anchor="middle">🛢️ Supabase Postgres</text>
  <line x1="115" y1="355" x2="305" y2="355" stroke="#3B82F6" stroke-width="0.5" opacity="0.25"/>
  <text x="210" y="373" fill="#1E293B" font-size="10" text-anchor="middle">RLS + evidence graph</text>
  <text x="210" y="390" fill="#64748B" font-size="9" text-anchor="middle">Auth · pgvector · Realtime</text>

  <rect x="340" y="320" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadowLight)"/>
  <rect x="340" y="320" width="220" height="90" rx="8" fill="#FFFBEB" opacity="0.3"/>
  <text x="450" y="345" fill="#D97706" font-size="13" font-weight="700" text-anchor="middle">🧠 Gemini</text>
  <line x1="355" y1="355" x2="545" y2="355" stroke="#F59E0B" stroke-width="0.5" opacity="0.25"/>
  <text x="450" y="373" fill="#1E293B" font-size="10" text-anchor="middle">Structured Agents</text>
  <text x="450" y="390" fill="#64748B" font-size="9" text-anchor="middle">Embeddings · Structured JSON</text>

  <rect x="580" y="320" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" filter="url(#shadowLight)"/>
  <rect x="580" y="320" width="220" height="90" rx="8" fill="#ECFDF5" opacity="0.3"/>
  <text x="690" y="345" fill="#059669" font-size="13" font-weight="700" text-anchor="middle">🔍 Tavily</text>
  <line x1="595" y1="355" x2="785" y2="355" stroke="#10B981" stroke-width="0.5" opacity="0.25"/>
  <text x="690" y="373" fill="#1E293B" font-size="10" text-anchor="middle">Hybrid Vendor Research</text>
  <text x="690" y="390" fill="#64748B" font-size="9" text-anchor="middle">Live + Fixture Fallback</text>

  <!-- 第二行：OR-Tools + Artifacts -->
  <rect x="100" y="425" width="340" height="45" rx="8" fill="#FFFFFF" stroke="#818CF8" stroke-width="1.5" filter="url(#shadowLight)"/>
  <rect x="100" y="425" width="340" height="45" rx="8" fill="#EEF2FF" opacity="0.3"/>
  <text x="270" y="448" fill="#6366F1" font-size="13" font-weight="700" text-anchor="middle">📊 OR-Tools CP-SAT</text>
  <text x="270" y="463" fill="#64748B" font-size="9" text-anchor="middle">Budget · Coverage · Hard Constraints · What-if Solver</text>

  <rect x="460" y="425" width="340" height="45" rx="8" fill="#FFFFFF" stroke="#EC4899" stroke-width="1.5" filter="url(#shadowLight)"/>
  <rect x="460" y="425" width="340" height="45" rx="8" fill="#FDF2F8" opacity="0.3"/>
  <text x="630" y="448" fill="#DB2777" font-size="13" font-weight="700" text-anchor="middle">📄 Artifacts</text>
  <text x="630" y="463" fill="#64748B" font-size="9" text-anchor="middle">DOCX · XLSX · PPTX · PDF · JSON · ICS</text>

  <!-- ============================================================ -->
  <!-- 底部图例 -->
  <!-- ============================================================ -->
  <rect x="80" y="500" width="740" height="1" fill="#E2E8F0"/>

  <text x="100" y="515" fill="#64748B" font-size="9" font-weight="500">Architecture Layers:</text>

  <circle cx="230" cy="514" r="4" fill="#FF0009"/>
  <text x="240" y="518" fill="#64748B" font-size="9">Core API</text>

  <circle cx="320" cy="514" r="4" fill="#3B82F6"/>
  <text x="330" y="518" fill="#64748B" font-size="9">Data</text>

  <circle cx="400" cy="514" r="4" fill="#F59E0B"/>
  <text x="410" y="518" fill="#64748B" font-size="9">AI/LLM</text>

  <circle cx="480" cy="514" r="4" fill="#10B981"/>
  <text x="490" y="518" fill="#64748B" font-size="9">Search</text>

  <circle cx="560" cy="514" r="4" fill="#818CF8"/>
  <text x="570" y="518" fill="#64748B" font-size="9">Solver</text>

  <circle cx="640" cy="514" r="4" fill="#EC4899"/>
  <text x="650" y="518" fill="#64748B" font-size="9">Artifacts</text>
</svg>