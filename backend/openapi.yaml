openapi: 3.1.0
info:
  title: TUNTAS API
  description: 'Traceable Upskilling & Normative Training Assurance System.


    Frontend first-paint: `GET /v1/runs/{run_id}/cockpit` → `CockpitBundle`.

    Dev auth: headers `X-Demo-Role` + optional `X-Demo-Actor` when DEMO_AUTH_BYPASS=true.

    TypeScript types: see `openapi.types.ts` (x-typescript-types embedded below).'
  version: 0.1.0
  x-typescript-types: "\n/**\n * TUNTAS API TypeScript types — keep in sync with backend/openapi.yaml\n\
    \ * Generated by scripts/export_openapi.py (hand-maintained shapes mirrored from\
    \ Pydantic).\n *\n * Auth (development):\n *   headers: { \"X-Demo-Role\": \"\
    manager\", \"X-Demo-Actor\": \"demo-manager\" }\n * Production:\n *   headers:\
    \ { Authorization: `Bearer ${supabaseJwt}` }\n */\n\nexport type RunStatus =\n\
    \  | \"created\"\n  | \"running\"\n  | \"awaiting_approval\"\n  | \"approved_processing\"\
    \n  | \"revising\"\n  | \"completed\"\n  | \"rejected\"\n  | \"failed\"\n  | \"\
    needs_policy_recompile\"\n  | string;\n\nexport type OptionKey = \"cost\" | \"\
    balanced\" | \"coverage\" | string;\n\nexport interface HealthResponse {\n  status:\
    \ string;\n  app: string;\n  env: string;\n  time: string; // ISO datetime\n}\n\
    \nexport interface CreateRunRequest {\n  request_id?: string | null;\n  trigger_path?:\
    \ string | null;\n  trigger_payload?: Record<string, unknown> | null;\n  use_synthetic_fallback?:\
    \ boolean;\n}\n\nexport interface CreateRunResponse {\n  run_id: string;\n  thread_id:\
    \ string;\n  request_id: string;\n  status: RunStatus;\n  employee_count: number;\n\
    \  synthetic: boolean;\n}\n\nexport interface ExecuteRunResponse {\n  run_id:\
    \ string;\n  status: RunStatus;\n  current_node?: string | null;\n  message: string;\n\
    }\n\nexport interface DecisionRequest {\n  option_key: OptionKey;\n  decision:\
    \ \"approve\" | \"reject\" | \"revise\";\n  rationale: string;\n  conditions?:\
    \ string[];\n  acting_manager_id?: string | null;\n  return_to_stage?: \"learning_architect\"\
    \ | \"challenger\" | \"optimizer\" | \"secretariat\" | null;\n  /** Stale guard\
    \ — pass portfolio_version from cockpit/what-if */\n  expected_portfolio_version?:\
    \ string | null;\n}\n\nexport interface DecisionResponse {\n  run_id: string;\n\
    \  status: RunStatus;\n  decision_id?: string | null;\n  message: string;\n}\n\
    \nexport interface MeResponse {\n  subject: string;\n  role: string;\n  email?:\
    \ string | null;\n  auth_mode: string;\n  permissions: string[];\n}\n\nexport\
    \ interface ErrorResponse {\n  detail: string | Record<string, unknown> | unknown[];\n\
    }\n\nexport interface RunStatusView {\n  run_id: string;\n  status: RunStatus;\n\
    \  current_node?: string | null;\n  updated_at: string;\n  awaiting_approval:\
    \ boolean;\n  portfolio_version?: string | null;\n  error_message?: string | null;\n\
    }\n\n/** SSE event names for GET /v1/runs/{run_id}/events/stream */\nexport type\
    \ RunRealtimeSseEvent =\n  | \"connected\"\n  | \"status\"\n  | \"audit\"\n  |\
    \ \"handoff\"\n  | \"heartbeat\";\n\nexport interface RunRequestSummary {\n  request_id?:\
    \ string | null;\n  source?: string | null;\n  synthetic: boolean;\n  max_budget_per_employee_myr?:\
    \ number | null;\n  total_budget_myr?: number | null;\n  min_operational_coverage_ratio?:\
    \ number | null;\n  training_window_start?: string | null;\n  training_window_end?:\
    \ string | null;\n  frameworks: string[];\n  employee_count: number;\n  portfolio_version?:\
    \ string | null;\n}\n\n/** Full portfolio shape — returned by GET /runs/{id},\
    \ /options, /cockpit, /what-if */\nexport interface PortfolioOptionDetail {\n\
    \  id: string;\n  option_key: OptionKey;\n  label: string;\n  total_cost_myr:\
    \ number;\n  cost_per_employee_myr: number;\n  coverage_score: number;\n  risk_reduction_score:\
    \ number;\n  operational_coverage: number;\n  hard_constraint_ok: boolean;\n \
    \ solver_status?: string | null;\n  challenger_flags: Record<string, unknown>[];\n\
    \  metrics: Record<string, unknown>;\n  assignments: Record<string, unknown>[];\n\
    }\n\nexport interface WhatIfRequest {\n  max_cost_per_employee_myr?: number |\
    \ null;\n  total_budget_myr?: number | null;\n  min_operational_coverage_ratio?:\
    \ number | null;\n  /** false = preview only; true (default) = persist DB + sync\
    \ LangGraph checkpoint */\n  apply?: boolean;\n}\n\nexport interface WhatIfResponse\
    \ {\n  run_id: string;\n  options: PortfolioOptionDetail[];\n  applied: boolean;\n\
    \  checkpoint_synced: boolean;\n  portfolio_version?: string | null;\n}\n\nexport\
    \ interface RunEvent {\n  id: string;\n  event_type: string;\n  actor_id: string;\n\
    \  actor_role: string;\n  payload: Record<string, unknown>;\n  created_at: string;\n\
    }\n\nexport interface RunListItem {\n  id: string;\n  request_id: string;\n  thread_id:\
    \ string;\n  status: RunStatus;\n  current_node?: string | null;\n  trigger_schema_version:\
    \ string;\n  selected_option_id?: string | null;\n  created_at: string;\n  updated_at:\
    \ string;\n  error_message?: string | null;\n  employee_count: number;\n}\n\n\
    /** GET /v1/runs/{run_id} — options include assignments (same as /options) */\n\
    export interface RunDetail {\n  id: string;\n  request_id: string;\n  thread_id:\
    \ string;\n  status: RunStatus;\n  current_node?: string | null;\n  trigger_schema_version:\
    \ string;\n  employee_count: number;\n  selected_option_id?: string | null;\n\
    \  created_at: string;\n  updated_at: string;\n  options: PortfolioOptionDetail[];\n\
    \  latest_events: RunEvent[];\n}\n\nexport interface AgentHandoffView {\n  id:\
    \ string;\n  agent_name: string;\n  input_hash: string;\n  output_json: Record<string,\
    \ unknown>; // envelope: schema_version, payload, confidence, ...\n  citation_coverage?:\
    \ number | null;\n  latency_ms?: number | null;\n  model_name?: string | null;\n\
    \  created_at: string;\n}\n\nexport interface TimelineResponse {\n  run_id: string;\n\
    \  items: Array<\n    | {\n        kind: \"handoff\";\n        id: string;\n \
    \       at: string;\n        agent_name: string;\n        latency_ms?: number\
    \ | null;\n        model_name?: string | null;\n        citation_coverage?: number\
    \ | null;\n        requires_review: boolean;\n        summary: string;\n     \
    \ }\n    | {\n        kind: \"event\";\n        id: string;\n        at: string;\n\
    \        event_type: string;\n        actor_id: string;\n        actor_role: string;\n\
    \        payload: Record<string, unknown>;\n      }\n  >;\n}\n\nexport interface\
    \ EvidenceNodeView {\n  id: string;\n  node_type: string;\n  external_ref: string;\n\
    \  label: string;\n  payload: Record<string, unknown>;\n  content_hash?: string\
    \ | null;\n  created_at?: string | null;\n}\n\nexport interface EvidenceEdgeView\
    \ {\n  id: string;\n  from_node_id: string;\n  to_node_id: string;\n  edge_type:\
    \ string;\n  weight: number;\n  payload: Record<string, unknown>;\n}\n\nexport\
    \ interface EvidenceGraphResponse {\n  run_id: string;\n  nodes: EvidenceNodeView[];\n\
    \  edges: EvidenceEdgeView[];\n}\n\nexport interface EvidenceLineageResponse {\n\
    \  root_node_id: string;\n  nodes: Record<string, unknown>[];\n  edges: Record<string,\
    \ unknown>[];\n}\n\nexport interface EmployeeListItem {\n  employee_ref: string;\n\
    \  pseudonym: string;\n  role_code?: string | null;\n  role_title?: string | null;\n\
    \  unit?: string | null;\n  location?: string | null;\n  current_level?: number\
    \ | null;\n  target_level?: number | null;\n  availability_pct?: number | null;\n\
    \  competency_gaps: Record<string, unknown>[];\n  readiness: Record<string, unknown>[];\n\
    }\n\nexport interface EmployeeDetail extends EmployeeListItem {\n  assessments:\
    \ Record<string, unknown>[];\n  schedule: Record<string, unknown>[];\n  simulation_attempts:\
    \ Record<string, unknown>[];\n}\n\nexport interface ScenarioView {\n  id: string;\n\
    \  code: string;\n  title: string;\n  role_focus: string;\n  prompt?: string |\
    \ null;\n  rubric: Record<string, unknown>[];\n  created_at?: string | null;\n\
    }\n\nexport interface TrainingSessionView {\n  id: string;\n  course_code: string;\n\
    \  title: string;\n  starts_at: string;\n  ends_at: string;\n  delivery_mode:\
    \ string;\n  location?: string | null;\n  capacity: number;\n  metadata: Record<string,\
    \ unknown>;\n}\n\nexport interface ScheduleAssignmentView {\n  id: string;\n \
    \ employee_ref: string;\n  course_code: string;\n  cost_myr: number;\n  session_id:\
    \ string;\n  session_title?: string | null;\n  starts_at?: string | null;\n  ends_at?:\
    \ string | null;\n}\n\nexport interface AssuranceSnapshotView {\n  id: string;\n\
    \  kirkpatrick: Record<string, unknown>;\n  residual_risk: Record<string, unknown>;\n\
    \  control_coverage: Record<string, unknown>;\n  created_at: string;\n}\n\nexport\
    \ interface ApprovalDecisionView {\n  id: string;\n  decision: string;\n  conditions:\
    \ unknown[];\n  rationale: string;\n  actor_id: string;\n  actor_role: string;\n\
    \  input_hash: string;\n  created_at: string;\n  option_key: string;\n  option_label:\
    \ string;\n}\n\nexport interface ArtifactView {\n  id: string;\n  artifact_type:\
    \ string;\n  filename: string;\n  storage_path?: string | null;\n  content_type:\
    \ string;\n  sha256: string;\n  hmac_signature: string;\n  byte_size: number;\n\
    \  created_at: string;\n}\n\nexport interface CockpitBundle {\n  run: {\n    id:\
    \ string;\n    request_id: string;\n    thread_id: string;\n    status: RunStatus;\n\
    \    current_node?: string | null;\n    trigger_schema_version: string;\n    employee_count:\
    \ number;\n    selected_option_id?: string | null;\n    created_at: string;\n\
    \    updated_at: string;\n    error_message?: string | null;\n    awaiting_approval:\
    \ boolean;\n  };\n  request?: RunRequestSummary | null;\n  options: PortfolioOptionDetail[];\n\
    \  handoffs: AgentHandoffView[];\n  latest_events: Record<string, unknown>[];\n\
    \  assurance: AssuranceSnapshotView | null;\n  assurance_history: AssuranceSnapshotView[];\n\
    \  scenarios: Array<{ id: string; code: string; title: string; role_focus: string\
    \ }>;\n  artifacts: ArtifactView[];\n  sessions: TrainingSessionView[];\n  approval:\
    \ ApprovalDecisionView | null;\n  employee_count: number;\n  portfolio_version?:\
    \ string | null;\n}\n\nexport interface AdaptiveSessionView {\n  session_id: string;\n\
    \  scenario_id: string;\n  run_id: string;\n  employee_ref: string;\n  status:\
    \ string;\n  difficulty: string;\n  turns: Record<string, unknown>[];\n  attempt_id?:\
    \ string | null;\n  created_at?: string | null;\n  updated_at?: string | null;\n\
    \  adaptive: boolean;\n}\n\nexport interface BlastRadiusResponse {\n  run_id?:\
    \ string | null;\n  framework_code?: string | null;\n  affected_nodes: Record<string,\
    \ unknown>[];\n  affected_employees: string[];\n  affected_courses: string[];\n\
    \  [key: string]: unknown;\n}\n\nexport interface BlastReopenRequest {\n  framework_code:\
    \ string;\n  reason?: string;\n}\n\nexport interface BlastReopenResponse {\n \
    \ run_id: string;\n  status: RunStatus;\n  framework_code: string;\n  recompiled_employee_count:\
    \ number;\n  affected_employees: string[];\n  langgraph_interrupt_rearmed: boolean;\n\
    \  options: Record<string, unknown>[];\n  message: string;\n}\n\nexport interface\
    \ SimulationAttemptRequest {\n  employee_ref: string;\n  responses: Record<string,\
    \ unknown>;\n}\n\nexport interface SimulationAttemptResponse {\n  attempt_id:\
    \ string;\n  score: number;\n  level_awarded: number;\n  evidence_hash: string;\n\
    \  feedback: Record<string, unknown>;\n  assurance_phase?: string | null;\n  assurance_refreshed?:\
    \ boolean | null;\n  assurance_error?: string | null;\n  residual_risk?: Record<string,\
    \ unknown> | null;\n  session_id?: string | null;\n  adaptive?: boolean | null;\n\
    \  status?: string | null;\n  learner_turns?: number | null;\n}\n\nexport interface\
    \ AdaptiveSessionStartResponse {\n  session_id: string;\n  scenario_id: string;\n\
    \  employee_ref: string;\n  status: string;\n  difficulty: string;\n  turn: Record<string,\
    \ unknown>;\n  adaptive: boolean;\n  scoring: string;\n}\n\nexport interface AdaptiveTurnResponse\
    \ {\n  session_id: string;\n  status: string;\n  difficulty: string;\n  learner_turn:\
    \ Record<string, unknown>;\n  turn: Record<string, unknown>;\n  can_finalize:\
    \ boolean;\n  adaptive: boolean;\n}\n\nexport interface MetricsSummary {\n  runs_total:\
    \ number;\n  runs_awaiting_approval: number;\n  runs_completed: number;\n  hard_constraint_violations:\
    \ number;\n  avg_budget_utilization: number | null;\n  citation_coverage_avg:\
    \ number | null;\n  approval_bypass_attempts: number;\n  avg_handoff_latency_ms?:\
    \ number | null;\n  artifact_completeness_avg?: number | null;\n}\n\nexport interface\
    \ AssuranceRefreshResponse {\n  run_id: string;\n  phase: string;\n  assurance:\
    \ Record<string, unknown>;\n  node_id?: string | null;\n}\n\n/**\n * Complete\
    \ path map — must stay 1:1 with FastAPI routes in openapi.yaml.\n * Regenerate\
    \ via: python scripts/export_openapi.py\n */\nexport type ApiPaths = {\n  \"GET\
    \ /health\": { response: HealthResponse };\n  \"GET /v1/me\": { response: MeResponse\
    \ };\n\n  \"GET /v1/runs\": { response: RunListItem[] };\n  \"POST /v1/runs\"\
    : { body: CreateRunRequest; response: CreateRunResponse };\n  \"GET /v1/runs/{run_id}\"\
    : { response: RunDetail };\n  \"GET /v1/runs/{run_id}/status\": { response: RunStatusView\
    \ };\n  \"POST /v1/runs/{run_id}/execute\": { response: ExecuteRunResponse };\n\
    \  \"GET /v1/runs/{run_id}/cockpit\": { response: CockpitBundle };\n  \"GET /v1/runs/{run_id}/events\"\
    : { response: RunEvent[] };\n  /** SSE text/event-stream — events: connected |\
    \ status | audit | handoff | heartbeat */\n  \"GET /v1/runs/{run_id}/events/stream\"\
    : {\n    query?: {\n      demo_role?: string;\n      demo_actor?: string;\n  \
    \    access_token?: string;\n      heartbeat_seconds?: number;\n    };\n    response:\
    \ ReadableStream; // text/event-stream\n  };\n  \"GET /v1/runs/{run_id}/handoffs\"\
    : { response: AgentHandoffView[] };\n  \"GET /v1/runs/{run_id}/timeline\": { response:\
    \ TimelineResponse };\n  \"GET /v1/runs/{run_id}/evidence-graph\": { response:\
    \ EvidenceGraphResponse };\n  \"GET /v1/runs/{run_id}/employees\": { response:\
    \ EmployeeListItem[] };\n  \"GET /v1/runs/{run_id}/employees/{employee_ref}\"\
    : { response: EmployeeDetail };\n  \"GET /v1/runs/{run_id}/scenarios\": { response:\
    \ ScenarioView[] };\n  \"GET /v1/runs/{run_id}/sessions\": { response: TrainingSessionView[]\
    \ };\n  \"GET /v1/runs/{run_id}/assignments\": { response: ScheduleAssignmentView[]\
    \ };\n  \"GET /v1/runs/{run_id}/assurance\": { response: AssuranceSnapshotView[]\
    \ };\n  \"POST /v1/runs/{run_id}/assurance/refresh\": { response: AssuranceRefreshResponse\
    \ };\n  \"GET /v1/runs/{run_id}/approval\": { response: ApprovalDecisionView |\
    \ null };\n  \"GET /v1/runs/{run_id}/approvals\": { response: ApprovalDecisionView[]\
    \ };\n  \"GET /v1/runs/{run_id}/options\": { response: PortfolioOptionDetail[]\
    \ };\n  \"GET /v1/runs/{run_id}/options/{option_key}\": { response: PortfolioOptionDetail\
    \ };\n  \"POST /v1/runs/{run_id}/what-if\": { body: WhatIfRequest; response: WhatIfResponse\
    \ };\n  \"POST /v1/runs/{run_id}/decision\": {\n    body: DecisionRequest;\n \
    \   headers?: { \"Idempotency-Key\"?: string };\n    response: DecisionResponse;\n\
    \  };\n  \"POST /v1/runs/{run_id}/resume\": {\n    body: DecisionRequest;\n  \
    \  headers?: { \"Idempotency-Key\"?: string };\n    response: DecisionResponse;\n\
    \  };\n  \"GET /v1/runs/{run_id}/artifacts\": { response: ArtifactView[] };\n\
    \  \"GET /v1/runs/{run_id}/blast-radius\": { response: BlastRadiusResponse };\n\
    \  \"POST /v1/runs/{run_id}/blast-radius/reopen\": {\n    body: BlastReopenRequest;\n\
    \    response: BlastReopenResponse;\n  };\n\n  \"GET /v1/artifacts/{artifact_id}\"\
    : { response: Blob }; // FileResponse download\n  \"GET /v1/evidence/{node_id}/lineage\"\
    : { response: EvidenceLineageResponse };\n  \"GET /v1/metrics/summary\": { response:\
    \ MetricsSummary };\n\n  \"POST /v1/simulations/{scenario_id}/attempts\": {\n\
    \    body: SimulationAttemptRequest;\n    response: SimulationAttemptResponse;\n\
    \  };\n  \"POST /v1/simulations/{scenario_id}/sessions\": {\n    body: { employee_ref:\
    \ string };\n    response: AdaptiveSessionStartResponse;\n  };\n  \"GET /v1/simulations/{scenario_id}/sessions\"\
    : { response: AdaptiveSessionView[] };\n  \"GET /v1/simulations/sessions/{session_id}\"\
    : { response: AdaptiveSessionView };\n  \"POST /v1/simulations/sessions/{session_id}/turns\"\
    : {\n    body: { learner_action: string; actions?: string[] };\n    response:\
    \ AdaptiveTurnResponse;\n  };\n  \"POST /v1/simulations/sessions/{session_id}/finalize\"\
    : {\n    response: SimulationAttemptResponse;\n  };\n  \"POST /v1/simulations/sessions/{session_id}/abandon\"\
    : {\n    response: AdaptiveSessionView;\n  };\n};\n"
