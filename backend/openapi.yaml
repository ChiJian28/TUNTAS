  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Supabase access token (Authorization: Bearer …)'
    DemoRole:
      type: apiKey
      in: header
      name: X-Demo-Role
      description: Dev-only role when DEMO_AUTH_BYPASS=true (viewer|analyst|manager|compliance|admin)
    DemoActor:
      type: apiKey
      in: header
      name: X-Demo-Actor
      description: Optional demo actor id paired with X-Demo-Role
    McpToken:
      type: apiKey
      in: header
      name: X-MCP-Token
      description: WorkBuddy MCP service token
servers:
- url: http://localhost:8001
  description: Local TUNTAS API (TrustLoop uses 8000)
security:
- BearerAuth: []
- DemoRole: []
  DemoActor: []
- McpToken: []
